# Generate custom light/dark-adaptive profile SVG cards and commit them into
# the repo, avoiding any reliance on rate-limited public stats services.
name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/readme-cards.yml"
      - "scripts/generate_cards.py"

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # GITHUB_TOKEN only sees public data. To include private contributions,
      # add a PAT (scopes: repo, read:user) as the STATS_TOKEN secret.
      - name: Generate profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_cards.py \
            --username "${{ github.repository_owner }}" \
            --featured "BazaarPlusPlus/BazaarPlusPlus" \
            --output-dir profile

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
