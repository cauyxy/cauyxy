# Generate the GitHub stats cards as static SVGs and commit them into the repo,
# so the README no longer depends on the rate-limited public Vercel instance.
name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/readme-cards.yml"

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # role=ORGANIZATION_MEMBER also counts stars of org repos (e.g. BazaarPlusPlus/*).
      # GITHUB_TOKEN only sees public data. To include private contributions,
      # add a PAT (scopes: repo, read:user) as the STATS_TOKEN secret.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radical&hide_border=true&role=OWNER,ORGANIZATION_MEMBER
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=radical&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate BazaarPlusPlus pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=BazaarPlusPlus&repo=BazaarPlusPlus&theme=radical&hide_border=true
          path: profile/pin-bazaarplusplus.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
